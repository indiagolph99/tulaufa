name: Release

# manual only — cut a dated release branch from stable and open its PR
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Guard — stable only
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/stable" ]; then
            echo "::error::Release must be run from 'stable' (got ${REF#refs/heads/})"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: stable
          fetch-depth: 0

      - name: Cut release branch
        id: cut
        run: |
          set -euo pipefail
          base="release/$(date -u +%Y-%m-%d)"
          branch="$base"
          n=2
          # a second release on the same day gets .2, .3, ...
          while git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; do
            branch="$base.$n"
            n=$((n + 1))
          done

          git switch -c "$branch"
          git push origin "$branch"

          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open release PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.cut.outputs.branch }}
        run: |
          set -euo pipefail

          # nothing to merge back if main already matches — branch still deploys
          if [ -z "$(git log --oneline origin/main.."$BRANCH")" ]; then
            echo "no_pr=1" >> "$GITHUB_OUTPUT"
            echo "::notice::main is already up to date with $BRANCH — no PR opened."
            exit 0
          fi

          url="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Release $BRANCH" \
            --body "Релиз, срезанный с \`stable\`.

Развернуть: запустите **Deploy to VPS** с выбранной веткой \`$BRANCH\`.
Влейте этот PR, чтобы \`main\` отражал то, что уехало в продакшен." )"

          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          BRANCH: ${{ steps.cut.outputs.branch }}
          SHA: ${{ steps.cut.outputs.sha }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          {
            echo "Cut **\`$BRANCH\`** from \`stable\` at \`$SHA\`."
            echo ""
            if [ -n "${PR_URL:-}" ]; then
              echo "PR: $PR_URL"
            else
              echo "_No PR — \`main\` already matches this branch._"
            fi
            echo ""
            echo "Run **Deploy to VPS** with \`$BRANCH\` selected to ship it."
          } >> "$GITHUB_STEP_SUMMARY"
