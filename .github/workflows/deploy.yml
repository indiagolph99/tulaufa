name: deploy

# manual only. the gate is the 'production' environment, not a branch guard:
# GitHub holds the run for approval and refuses any ref outside its branch policy.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write # to push the release tag

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://tulaufa.ru

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Rsync build/ to docroot
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT -o StrictHostKeyChecking=yes" \
            build/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH"

      - name: Tag this release
        id: tag
        run: |
          set -euo pipefail

          # annotated tags need a committer; runners have none configured
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          base="v$(date -u +%Y.%m.%d)"
          tag="$base"
          n=2
          # a second deploy the same day gets .2, .3, ...
          while git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; do
            tag="$base.$n"
            n=$((n + 1))
          done

          git tag -a "$tag" -m "Deployed to tulaufa.ru"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          {
            echo "Deployed \`$TAG\` to <https://tulaufa.ru>."
            echo ""
            echo "Docroot now mirrors \`build/\` exactly."
          } >> "$GITHUB_STEP_SUMMARY"
